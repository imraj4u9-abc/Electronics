name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: SSH Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
         set -e
          cd ~
          # Install git first
          sudo apt-get update
          sudo apt-get install git -y
          sudo apt-get install docker.io -y
          sudo apt-get install docker-compose-plugin -y
          if [ ! -d electronics-app ]; then
            git clone https://github.com/imraj4u9-abc/Electronics.git electronics-app
          fi
          cd electronics-app
          git pull
          docker compose down
          docker compose up -d --build





